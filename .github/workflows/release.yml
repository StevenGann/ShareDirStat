name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --no-audit --no-fund && npm run lint && npm run typecheck && npm run test && npm run build
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 ./...
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        goos: [linux]
        goarch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -e
          VERSION=${GITHUB_REF_NAME#v}
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NAME=sharedirstat_${VERSION}_${GOOS}_${GOARCH}
          mkdir -p dist/$NAME
          go build -trimpath -ldflags "-s -w \
            -X github.com/StevenGann/ShareDirStat/internal/version.Version=$VERSION \
            -X github.com/StevenGann/ShareDirStat/internal/version.Commit=${GITHUB_SHA::7} \
            -X github.com/StevenGann/ShareDirStat/internal/version.Date=$DATE" \
            -o dist/$NAME/sharedirstat ./cmd/sharedirstat
          cp LICENSE README.md config.example.yaml dist/$NAME/
          tar -C dist -czf dist/$NAME.tar.gz $NAME
          rm -r dist/$NAME
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          retention-days: 1

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        id: name
        # OCI references must be lower-case; the repository owner is not.
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sharedirstat" >> "$GITHUB_ENV"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sharedirstat" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-,format=short
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          for tag in $TAGS; do images="$images ${tag}@${DIGEST}"; done
          cosign sign --yes $images
      - name: SBOM (SPDX) for the release
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 1
      - name: Scan released image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Package with the release version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          helm package deploy/helm/sharedirstat --destination dist/ \
            --version "$VERSION" --app-version "$VERSION"
      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/sharedirstat-*.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz
          retention-days: 1

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [binaries, image, chart]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets and checksums
        run: |
          mkdir -p release
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;
          find artifacts -name 'sharedirstat-*.tgz' -exec cp {} release/ \;
          cp artifacts/sbom/sbom.spdx.json release/
          (cd release && sha256sum * > SHA256SUMS)
          ls -l release
      - name: Release notes
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          cat > notes.md <<NOTES
          ## Container image

          \`\`\`
          docker pull ${IMAGE}:${GITHUB_REF_NAME#v}
          \`\`\`

          Multi-arch (linux/arm64, linux/amd64). Digest: \`${DIGEST}\`

          Verify the signature:

          \`\`\`
          cosign verify ${IMAGE}@${DIGEST} \\
            --certificate-identity-regexp='^https://github.com/${GITHUB_REPOSITORY}/' \\
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          \`\`\`

          Helm chart:

          \`\`\`
          helm install sharedirstat oci://ghcr.io/${OWNER}/charts/sharedirstat --version ${GITHUB_REF_NAME#v}
          \`\`\`

          Binaries below are for running outside a container; \`SHA256SUMS\` covers every asset.
          NOTES
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
