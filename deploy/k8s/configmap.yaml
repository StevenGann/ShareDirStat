apiVersion: v1
kind: ConfigMap
metadata:
  name: sharedirstat-config
data:
  config.yaml: |
    server:
      allowed_hosts: ["sharedirstat.home.arpa"]
    scan:
      default_concurrency: 16
      default_schedule: "0 3 * * *"
    shares:
      - id: media
        name: Media
        path: /shares/media
        allow_delete: true
      - id: backups
        name: Backups
        path: /shares/backups
        allow_delete: false
