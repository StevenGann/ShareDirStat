# ShareDirStat — Docker Compose reference deployment (specification §14.2).
# 1. Adjust the volume mounts under `volumes:` to your shares.
# 2. Set `user:` to the UID:GID that owns the share data (needed for delete).
# 3. Put ShareDirStat behind your reverse proxy / auth — it has none of its own.
services:
  sharedirstat:
    image: ghcr.io/stevengann/sharedirstat:edge
    container_name: sharedirstat
    user: "1000:1000"
    ports:
      - "8080:8080"
    environment:
      TZ: UTC
      # SDS_SERVER__ALLOWED_HOSTS: "sharedirstat.lan,192.168.1.50"
      # SDS_LOG__FORMAT: text
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - sds-data:/data
      # Shares — rw where you want delete to be possible, ro where you never do.
      - /mnt/nas/media:/shares/media
      - /mnt/nas/backups:/shares/backups:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/sharedirstat", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  sds-data:
